<script>
(function() {
  "use strict";
  
  // ============================================
  // VERSION CONTROL - CHANGE ONLY HERE
  // ============================================
  var VERSION = "v1.1.0";  // Keep in sync with the a.css link in the CMS
  var BASE = "https://cdn.jsdelivr.net/gh/casperudesen/global-styles@" + VERSION;
  var DEBUG = false;  // Set false for production
  
  // ============================================
  // PREVENT DOUBLE INIT
  // ============================================
  if (window.fbNavSystemLoaded) return;
  window.fbNavSystemLoaded = true;
  

  var NAV_ID = "fb-nav";
  var CONTAINER_ID = "fb-nav-container";
  var navHTML = null;
  var currentPath = location.pathname;
  var injectionInProgress = false;

  // ============================================
  // 0. LOADING CURTAIN (server-rendered #fb-curtain)
  //    Water level follows real progress; lifts when CSS + nav are in.
  // ============================================
  var curtainCss = false, curtainNav = false, curtainDone = false;

  function curtainLevel(p) {
    var c = document.getElementById("fb-curtain");
    if (!c) return;
    c.classList.add("is-live");
    c.style.setProperty("--fb-p", String(p));
  }

  function curtainStep() {
    if (curtainDone) return;
    if (!(curtainCss && curtainNav)) {
      curtainLevel(curtainCss || curtainNav ? 0.8 : 0.6);
      return;
    }
    curtainDone = true;
    curtainLevel(1);
    var c = document.getElementById("fb-curtain");
    if (c) c.classList.add("is-full");
    setTimeout(function() {
      var el = document.getElementById("fb-curtain");
      if (el) el.classList.add("is-done");
      setTimeout(function() {
        var n = document.getElementById("fb-curtain");
        if (n && n.parentNode) n.parentNode.removeChild(n);
        var s = document.getElementById("fb-curtain-css");
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }, 600);
    }, 650);
    log("Curtain lifted");
  }
  
  // ============================================
  // LOGGING
  // ============================================
  function log() {
    if (DEBUG) {
      var args = Array.prototype.slice.call(arguments);
      args.unshift("[FB GTM " + VERSION + "]");
      console.log.apply(console, args);
    }
  }
  
  // ============================================
  // 1. LOAD CSS (once)
  // ============================================
  function loadCSS() {
    // a.css normally comes from the CMS ("Efter <body>" slot) so it is in place
    // before first paint. GTM only loads it when that link is missing.
    var existing = document.getElementById("fb-global-css") ||
      document.querySelector('link[rel="stylesheet"][href*="global-styles"][href*="/a.css"]');
    if (existing) {
      curtainCss = true;
      curtainStep();
      log("CSS already on page:", existing.href);
      return;
    }
    var css = document.createElement("link");
    css.id = "fb-global-css";
    css.rel = "stylesheet";
    css.href = BASE + "/a.css?v=" + VERSION;
    css.onload = css.onerror = function() {
      curtainCss = true;
      curtainStep();
    };
    document.head.appendChild(css);
    log("CSS loaded (fallback)");
  }

  // ============================================
  // 3. FETCH NAV HTML
  // ============================================
  function fetchNavHTML(callback) {
    if (navHTML) {
      callback(navHTML);
      return;
    }
    
    var xhr = new XMLHttpRequest();
    xhr.open("GET", BASE + "/nav.html?v=" + VERSION, true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          navHTML = xhr.responseText;
          log("Nav HTML fetched");
          callback(navHTML);
        } else {
          log("Nav fetch failed:", xhr.status);
        }
      }
    };
    xhr.send();
  }
  
  // ============================================
  // 4. INJECT NAVIGATION
  // ============================================
  function injectNav(reason) {
    if (injectionInProgress) {
      log("Injection in progress, skipping");
      return;
    }
    
    if (document.getElementById(NAV_ID)) {
      log("Nav already exists");
      curtainNav = true;
      curtainStep();
      return;
    }
    
    injectionInProgress = true;
    log("Injecting nav:", reason);
    
    fetchNavHTML(function(html) {
      if (document.getElementById(NAV_ID)) {
        injectionInProgress = false;
        return;
      }
      
      var container = document.getElementById(CONTAINER_ID);
      if (!container) {
        container = document.createElement("div");
        container.id = CONTAINER_ID;
        // Append to documentElement, not body (React controls body)
        document.documentElement.appendChild(container);
      }
      
      container.innerHTML = html;
      initNavBehavior();
      injectionInProgress = false;
      curtainNav = true;
      curtainStep();
      log("Nav injected successfully");
    });
  }
  
  // ============================================
  // 5. INIT NAV BEHAVIOR
  // ============================================
  function initNavBehavior() {
    var nav = document.getElementById(NAV_ID);
    if (!nav) return;
    
    // Apply scroll state immediately
    if (window.scrollY > 50) {
      nav.classList.add("fb-nav--scrolled");
    }
    
    // Call nav.js init if loaded
    if (typeof window.fbNavInit === "function") {
      window.fbNavInit();
    }
  }
  
  // ============================================
  // 6. GLOBAL EVENT DELEGATION
  // ============================================
  function setupGlobalEvents() {
    // Hamburger toggle (delegated)
    document.addEventListener("click", function(e) {
      var toggle = e.target.closest("#fb-nav-toggle");
      var nav = document.getElementById(NAV_ID);
      
      if (toggle && nav) {
        e.preventDefault();
        e.stopPropagation();
        var isOpen = nav.classList.toggle("fb-nav--open");
        document.body.classList.toggle("fb-menu-open", isOpen);
        log("Menu toggled:", isOpen ? "open" : "closed");
      }
      
      // Close on mobile link click
      if (e.target.closest(".fb-nav__mobile-link")) {
        if (nav) nav.classList.remove("fb-nav--open");
        document.body.classList.remove("fb-menu-open");
      }
      
      // Detect internal link clicks for React Router
      var link = e.target.closest("a[href]");
      if (link) {
        var href = link.getAttribute("href");
        if (href && (href.startsWith("/") || href.startsWith(location.origin))) {
          log("Internal link click:", href);
          setTimeout(function() { ensureNav("link-click"); }, 50);
        }
      }
    }, true);  // Capture phase
    
    // Scroll effect
    window.addEventListener("scroll", function() {
      var nav = document.getElementById(NAV_ID);
      if (nav && !document.body.classList.contains("fb-menu-open")) {
        nav.classList.toggle("fb-nav--scrolled", window.scrollY > 50);
      }
    }, { passive: true });
    
    // Escape key closes menu
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") {
        var nav = document.getElementById(NAV_ID);
        if (nav && nav.classList.contains("fb-nav--open")) {
          nav.classList.remove("fb-nav--open");
          document.body.classList.remove("fb-menu-open");
        }
      }
    });
    
    log("Global events set up");
  }
  
  // ============================================
  // 7. ROUTE CHANGE DETECTION
  // ============================================
  function ensureNav(reason) {
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        if (!document.getElementById(NAV_ID)) {
          injectNav(reason);
        }
      });
    });
  }
  
  function onRouteChange(reason) {
    log("Route change:", reason, "->", location.pathname);
    currentPath = location.pathname;
    
    // Multiple attempts for React's async rendering
    ensureNav(reason);
    setTimeout(function() { ensureNav(reason + "+100"); }, 100);
    setTimeout(function() { ensureNav(reason + "+300"); }, 300);
    setTimeout(function() { ensureNav(reason + "+600"); }, 600);
    setTimeout(function() { ensureNav(reason + "+1200"); }, 1200);
    
    // Re-init page classes and animations
    setTimeout(initPageClasses, 200);
  }
  
  function hookHistoryAPI() {
    var originalPushState = history.pushState;
    history.pushState = function() {
      originalPushState.apply(this, arguments);
      log("pushState");
      onRouteChange("pushState");
    };
    
    var originalReplaceState = history.replaceState;
    history.replaceState = function() {
      originalReplaceState.apply(this, arguments);
      log("replaceState");
      setTimeout(function() { ensureNav("replaceState"); }, 100);
    };
    
    window.addEventListener("popstate", function() {
      log("popstate");
      onRouteChange("popstate");
    });
    
    log("History API hooked");
  }
  
  // ============================================
  // 8. DOM MONITORING (NOW WITH MUTATIONOBSERVER)
  // ============================================
  function startMonitoring() {
    // NEW: MutationObserver for React removing our nav
    var observer = new MutationObserver(function() {
      if (!document.getElementById(NAV_ID)) {
        log("MutationObserver: Nav missing, re-injecting");
        ensureNav("mutation-observer");
      }
    });
    
    // Start observing when body is ready
    if (document.body) {
      observer.observe(document.body, { childList: true, subtree: true });
      log("MutationObserver started");
    } else {
      document.addEventListener("DOMContentLoaded", function() {
        observer.observe(document.body, { childList: true, subtree: true });
        log("MutationObserver started (after DOMContentLoaded)");
      });
    }
    
    // Check for missing nav (fallback interval)
    setInterval(function() {
      if (!document.getElementById(NAV_ID) || !document.getElementById(CONTAINER_ID)) {
        injectNav("interval-check");
      }
    }, 500);
    
    // Check for path changes (React might change URL without events)
    setInterval(function() {
      if (location.pathname !== currentPath) {
        log("Path changed:", currentPath, "->", location.pathname);
        onRouteChange("path-poll");
      }
    }, 200);
    
    // BFCache handling
    window.addEventListener("pageshow", function(e) {
      var isBackForward = e.persisted;
      
      if (!isBackForward && window.performance && 
          typeof window.performance.getEntriesByType === "function") {
        var navEntry = window.performance.getEntriesByType("navigation")[0];
        if (navEntry && navEntry.type === "back_forward") {
          isBackForward = true;
        }
      }
      
      if (isBackForward) {
        log("BFCache restore");
        onRouteChange("bfcache");
      }
    });
    
    log("Monitoring started");
  }
  
  // ============================================
  // 9. PAGE INITIALIZATION (Classes & Animations)
  // ============================================
  function initPageClasses() {
    if (document.body.classList.contains("fb-page-initialized")) return;
    
    // Add page slug class
    var pageSlug = location.pathname
      .replace(/^\//, "")
      .replace(/\/$/, "")
      .replace(/\//g, "-") || "forside";
    
    // Remove old page classes
    var oldClasses = [];
    document.body.classList.forEach(function(c) {
      if (c.startsWith("fb-page-")) oldClasses.push(c);
    });
    oldClasses.forEach(function(c) {
      document.body.classList.remove(c);
    });
    
    document.body.classList.add("fb-page-" + pageSlug);
    document.body.classList.add("fb-page-initialized");
    
    // Add section classes
    var sections = document.querySelectorAll("section[data-section-type]");
    var index = 0;
    
    sections.forEach(function(section) {
      var type = section.getAttribute("data-section-type");
      if (type === "DynamicSectionComponent" || type === "Emnevisning") {
        index++;
        section.classList.add("fb-section", "fb-section-" + index);
      }
    });
    
    // Detect hero section
    var heroSection = null;
    sections.forEach(function(section) {
      if (heroSection) return;
      if (section.querySelector(".hero-title") || 
          section.querySelector(".hero-buttons")) {
        heroSection = section;
      }
    });
    if (heroSection) {
      heroSection.classList.add("fb-hero-section");
    }
    
    log("Page classes initialized:", pageSlug, index + " sections");
    
    // Init animations
    initHeroAnimation();
    initSectionAnimations();
  }
  
  function initHeroAnimation() {
    var hero = document.querySelector(".fb-hero-section");
    if (!hero) return;
    
    var title = hero.querySelector(".hero-title");
    var subtitle = hero.querySelector(".hero-subtitle");
    var buttons = hero.querySelector(".hero-buttons");
    
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        if (title) title.classList.add("fb-visible");
        if (subtitle) subtitle.classList.add("fb-visible");
        if (buttons) buttons.classList.add("fb-visible");
      });
    });
    
    log("Hero animation initialized");
  }
  
  function initSectionAnimations() {
    if (!("IntersectionObserver" in window)) return;
    
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("fb-visible");
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.15,
      rootMargin: "0px 0px -60px 0px"
    });
    
    var animateSections = document.querySelectorAll(
      ".fb-section:not(.fb-section-1):not(.fb-hero-section)"
    );
    
    animateSections.forEach(function(el) {
      if (!el.classList.contains("fb-section-animate")) {
        el.classList.add("fb-section-animate");
        observer.observe(el);
      }
    });
    
    log("Section animations initialized:", animateSections.length);
  }
  
  // ============================================
  // 10. MAIN INITIALIZATION
  // ============================================
  function init() {
    log("Initializing...");
    
    // 1. Critical CSS first (prevents flash)
    curtainStep();
    
    // 2. Load full CSS
    loadCSS();
    
    // 3. Set up global events (delegated, only once)
    setupGlobalEvents();
    
    // 4. Hook history API
    hookHistoryAPI();
    
    // 5. Start monitoring (NOW INCLUDES MUTATIONOBSERVER)
    startMonitoring();
    
    // 6. Initial nav injection with retries
    injectNav("init");
    setTimeout(function() { injectNav("init+100"); }, 100);
    setTimeout(function() { injectNav("init+500"); }, 500);
    setTimeout(function() { injectNav("init+1000"); }, 1000);
    
    // 7. Init page classes after DOM settles
    setTimeout(initPageClasses, 200);
    setTimeout(initPageClasses, 600);
    
    log("Initialization complete");
  }
  
  // ============================================
  // START
  // ============================================
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
  
  // GTM usually runs after window load here, so don't rely on the load event alone
  setTimeout(function() { curtainCss = true; curtainNav = true; curtainStep(); }, 1500);
  window.addEventListener("load", function() {
    log("Window load");
    // Never hold the curtain past page load + 1.5s, even if a step failed
    setTimeout(function() { curtainCss = true; curtainNav = true; curtainStep(); }, 1500);
    ensureNav("window-load");
    initPageClasses();
  });
  
})();
</script>
